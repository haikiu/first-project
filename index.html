<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiết kế web và triển khai hệ thống phần mềm</title>
</head>
<body>
    <h1> Xin chào</h1>
    <h2> Hello</h2>
    <!-- Nhóm thẻ block  -->
    <p style="background-color: red;"> Đây là trang web đầu tiên của tôi</p>
    <p> Nội dung</p>
    <!-- Nhóm thẻ Inline-->
     <span>Nội dung</span>
     <span>Nội dung</span>

    <!-- Emmet -->
     <p>Nội dung 1</p>
     <p>Nội dung 2</p>
     <p>Nội dung 3</p>
     <p>Nội dung 4</p>
     <p>Nội dung 5</p>
     <p>Nội dung 6</p>
</body>
</html>
